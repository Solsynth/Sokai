<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sokai</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7577ba" />
    <link rel="icon" type="image/png" href="/img/icons/icon48x48.png" />

    <!--
      KaiOS localisation. `l10n.js` is a platform library, not app code, so it
      stays a plain classic script in `public/` and is loaded before the bundle.
      Privileged apps may not use inline scripts (CSP), hence the external file.
    -->
    <link rel="prefetch" type="application/l10n" href="/data/locales.ini" />
    <script src="/js/libs/l10n.js"></script>

    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
